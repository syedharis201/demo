<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced To-Do List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>Enhanced To-Do List</h1>
        
        <!-- Task Filter -->
        <div class="filter-buttons">
            <a href="{{ url_for('index', filter='all') }}" class="{{ 'active' if filter_status == 'all' else '' }}">All</a>
            <a href="{{ url_for('index', filter='completed') }}" class="{{ 'active' if filter_status == 'completed' else '' }}">Completed</a>
            <a href="{{ url_for('index', filter='pending') }}" class="{{ 'active' if filter_status == 'pending' else '' }}">Pending</a>
        </div>

        <!-- Add Task -->
        <form action="{{ url_for('add_task') }}" method="POST" class="task-form">
            <input type="text" name="task" placeholder="Enter a new task" required>
            <button type="submit">Add Task</button>
        </form>

        <!-- Task List -->
        <ul class="task-list">
            {% for task in tasks %}
                <li class="{{ 'completed' if task['completed'] else '' }}">
                    <span>{{ task['name'] }}</span>

                    <!-- Toggle Task Completion -->
                    <form action="{{ url_for('toggle_task', task_id=loop.index0) }}" method="POST">
                        <button type="submit">{{ 'Undo' if task['completed'] else 'Complete' }}</button>
                    </form>

                    <!-- Edit Task -->
                    <form action="{{ url_for('edit_task', task_id=loop.index0) }}" method="POST">
                        <input type="text" name="new_name" placeholder="Edit task name" required>
                        <button type="submit">Update</button>
                    </form>

                    <!-- Delete Task -->
                    <form action="{{ url_for('delete_task', task_id=loop.index0) }}" method="POST">
                        <button type="submit">Delete</button>
                    </form>
                </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
